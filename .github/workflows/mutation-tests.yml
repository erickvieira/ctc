name: Mutation tests

on:
  push:
  pull_request:

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-tests:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run mutation tests (PIT)
        run: ./gradlew mutationTest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest
          if-no-files-found: ignore
