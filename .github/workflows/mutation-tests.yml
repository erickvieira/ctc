name: Mutation tests

on:
  push:
  pull_request:

concurrency:
  group: mutation-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation-tests:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run mutation tests (PIT)
        run: ./gradlew mutationTest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: build/reports/pitest
          if-no-files-found: ignore

      - name: Compute mutation badge
        id: mutation_metrics
        run: python3 scripts/quality-metrics.py mutation >> "$GITHUB_OUTPUT"

      - name: Publish mutation badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: mutation.json
          label: mutation
          message: ${{ steps.mutation_metrics.outputs.value }}
          color: ${{ steps.mutation_metrics.outputs.color }}
