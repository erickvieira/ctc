name: Integration tests

on:
  push:
  pull_request:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests (Testcontainers)
        run: ./gradlew integrationTest -PmaxParallelForks=2 --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore

      - name: Compute integration test count badge
        id: integration_metrics
        run: python3 scripts/quality-metrics.py tests-integration >> "$GITHUB_OUTPUT"

      - name: Publish integration test count badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ secrets.GIST_ID }}
          filename: tests-integration.json
          label: integration tests
          message: ${{ steps.integration_metrics.outputs.value }}
          color: ${{ steps.integration_metrics.outputs.color }}
