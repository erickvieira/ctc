get:
  tags: [Events]
  summary: Consulta um evento pelo id.
  operationId: getEvent
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Evento encontrado.
      content:
        application/json:
          schema:
            $ref: '../schemas/Event.yaml'
    '404':
      description: Evento não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/Problem.yaml'
