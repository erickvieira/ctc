openapi: 3.0.3
info:
  title: Flash Booking API
  description: Núcleo de reserva de ingressos para eventos de capacidade limitada.
  version: 0.0.1
tags:
  - name: Events
    description: Gestão de eventos e sua disponibilidade.
  - name: Reservations
    description: Reserva, consulta e cancelamento de reservas.
paths:
  /events:
    $ref: './endpoints/events.yaml'
  /events/{id}:
    $ref: './endpoints/events_id.yaml'
  /events/{id}/reservations:
    $ref: './endpoints/events_id_reservations.yaml'
  /reservations/{id}:
    $ref: './endpoints/reservations_id.yaml'
  /reservations/{id}/confirmation:
    $ref: './endpoints/reservations_id_confirmation.yaml'
components:
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: >-
        Identificador do usuário autenticado que assina todas as requisições válidas.
      schema:
        type: string
        format: uuid
      example: 11111111-1111-1111-1111-111111111111
