openapi: 3.0.3
info:
  title: Flash Booking API
  description: Núcleo de reserva de ingressos para eventos de capacidade limitada.
  version: 0.0.1
tags:
  - name: Events
    description: Gestão de eventos e sua disponibilidade.
  - name: Reservations
    description: Reserva, consulta e cancelamento de reservas.
paths:
  /events/{id}:
    get:
      operationId: getEvent
      tags:
        - Events
      summary: Consulta um evento pelo id.
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: Evento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    EventIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Event:
      type: object
      required:
        - id
        - name
        - startsAt
        - capacity
        - available
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
        - timestamp
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time
